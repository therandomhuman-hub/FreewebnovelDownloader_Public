name: Monthly WebNovel Tracker

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 18:30 UTC is 00:00 IST. Days 28-31 are filtered
    # below so the job actually runs only on the last day of each month.
    - cron: '30 18 28-31 * *'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check month-end
        id: month_end
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today_month=$(date -u +%m)
          tomorrow_month=$(date -u -d 'tomorrow' +%m)
          if [ "$today_month" != "$tomorrow_month" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout public repository
        if: steps.month_end.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Checkout private downloader engine
        if: steps.month_end.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-engine

      - name: Set up Python
        if: steps.month_end.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: private-engine/requirements.txt

      - name: Install dependencies
        if: steps.month_end.outputs.run == 'true'
        run: pip install -r private-engine/requirements.txt

      - name: Run private engine
        if: steps.month_end.outputs.run == 'true'
        working-directory: private-engine
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_SHARE_EMAIL: ${{ secrets.GOOGLE_SHEET_SHARE_EMAIL }}
          GOOGLE_SHEET_NAME: Novels
          METADATA_WORKERS: '8'
        run: python novel_automator.py

      - name: Upload run summary
        if: always() && steps.month_end.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webnovel-run-summary
          path: private-engine/run_summary.json
          if-no-files-found: ignore
