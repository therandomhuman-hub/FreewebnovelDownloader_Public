name: WebNovel Production E2E Gate

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "Completed freewebnovel.com/novel/... URL for the real E2E test"
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  WORKFLOW_COUNT: "20"
  GOOGLE_COMPLETED_SHEET: "Sheet1"
  GOOGLE_ONGOING_SHEET: "Sheet2"
  COMMUNITY_LIBRARY_URL: "https://linktoepub.com/"
  COMMUNITY_LIBRARY_POLL_SECONDS: "300"
  COMMUNITY_LIBRARY_WATCH_TIMEOUT_SECONDS: "18000"
  COMMUNITY_LIBRARY_INITIAL_WAIT_SECONDS: "90"

concurrency:
  group: webnovel-downloader
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout tested private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: private-engine
          persist-credentials: false

      - name: Record engine revision
        working-directory: private-engine
        run: git rev-parse HEAD | tee engine-sha.txt

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: private-engine/requirements.txt

      - name: Install dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt

      - name: Compile private engine
        working-directory: private-engine
        run: python -m py_compile *.py tests/*.py

      - name: Run private-engine tests
        working-directory: private-engine
        run: python -m unittest discover -s tests -v

      - name: Prepare E2E source
        working-directory: private-engine
        env:
          TEST_URL: ${{ inputs.test_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from novel_automator import canonical_url
          url = canonical_url(os.environ["TEST_URL"].strip())
          if not url:
              raise SystemExit("test_url must be a valid HTTPS freewebnovel.com/novel/... URL without query/fragment")
          with open("data/e2e_test_source.json", "w", encoding="utf-8") as fh:
              json.dump([{"novel_url": url}], fh, indent=2)
          print(f"E2E_TEST_SOURCE_OK url={url}")
          PY

      - name: Run real production Community Library worker
        working-directory: private-engine
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          NOVEL_SOURCE_FILE: data/e2e_test_source.json
          WORKFLOW_ID: "0"
          WORKFLOW_COUNT: "20"
          BATCH_SIZE: "1"
          BATCHES_PER_RUN: "1"
          METADATA_WORKERS: "1"
          RUN_INDEX: "0"
          DRY_RUN: "false"
          COMMUNITY_LIBRARY_URL: ${{ env.COMMUNITY_LIBRARY_URL }}
          COMMUNITY_LIBRARY_POLL_SECONDS: ${{ env.COMMUNITY_LIBRARY_POLL_SECONDS }}
          COMMUNITY_LIBRARY_WATCH_TIMEOUT_SECONDS: ${{ env.COMMUNITY_LIBRARY_WATCH_TIMEOUT_SECONDS }}
          COMMUNITY_LIBRARY_INITIAL_WAIT_SECONDS: ${{ env.COMMUNITY_LIBRARY_INITIAL_WAIT_SECONDS }}
        run: python parallel_community_runner.py

      - name: Fail-closed E2E validation
        working-directory: private-engine
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          TEST_URL: ${{ inputs.test_url }}
        run: python e2e_gate.py --test-url "$TEST_URL"

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webnovel-production-e2e-diagnostics
          path: |
            private-engine/engine-sha.txt
            private-engine/worker_result.json
          if-no-files-found: warn
          retention-days: 30
