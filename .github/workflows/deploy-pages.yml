name: Deploy Momentum Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Stage public site only
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/privacy-policy _site/terms
          cp index.html _site/index.html
          cp privacy-policy/index.html _site/privacy-policy/index.html
          cp terms/index.html _site/terms/index.html
          test -f _site/index.html
          test -f _site/privacy-policy/index.html
          test -f _site/terms/index.html
          ! find _site -type f -name 'scheduler_state.json' | grep -q .
          ! find _site -type d -name '.github' | grep -q .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
