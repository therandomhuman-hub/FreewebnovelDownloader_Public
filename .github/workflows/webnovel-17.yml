name: WebNovel Worker 17
on:
  workflow_dispatch:
  schedule: [{cron: '0 */6 * * *'}]
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with: {repository: therandomhuman-hub/FreewebnovelDownloader_Private, token: ${{ secrets.PRIVATE_REPO_TOKEN }}, path: private-engine}
    - uses: actions/setup-python@v5
      with: {python-version: '3.12', cache: pip, cache-dependency-path: private-engine/requirements.txt}
    - run: pip install -r private-engine/requirements.txt
    - working-directory: private-engine
      env: {DROPBOX_ACCESS_TOKEN: '${{ secrets.DROPBOX_ACCESS_TOKEN }}', GOOGLE_SERVICE_ACCOUNT_JSON: '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}', GOOGLE_SHEET_ID: '${{ secrets.GOOGLE_SHEET_ID }}', GOOGLE_SHEET_SHARE_EMAIL: '${{ secrets.GOOGLE_SHEET_SHARE_EMAIL }}', GOOGLE_SHEET_NAME: Novels, NOVEL_SOURCE_FILE: data/scraped_novels.json, WORKFLOW_ID: '16', WORKFLOW_COUNT: '20', BATCH_SIZE: '5', BATCHES_PER_RUN: '2'}
      run: python novel_automator.py
