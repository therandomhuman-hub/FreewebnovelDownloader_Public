name: WebNovel Status Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  STATUS_WORKERS: "384"
  STATUS_REQUEST_TIMEOUT: "8"
  STATUS_RETRIES: "1"
  STATUS_EXPECTED_CATALOG_COUNT: "12419"
  STATUS_RETRY_ROUND_DELAY: "0.5"
  STATUS_MAX_ROUNDS: "10"
  STATUS_CHECKPOINT_EVERY: "1000"

concurrency:
  group: webnovel-status-catalog
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-engine
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: private-engine/requirements.txt

      - name: Install dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt

      - name: Compile and unit-test classifier
        working-directory: private-engine
        run: |
          set -euo pipefail
          python -m py_compile novel_status_classifier.py
          python - <<'PY'
          from novel_status_classifier import extract_metadata
          ongoing = '''<html><body><a>OnGoing</a><h1>Example Novel</h1><div>Updated a month ago</div></body></html>'''
          stale = '''<html><body><a>OnGoing</a><h1>Old Novel</h1><div>Updated 7 years ago</div></body></html>'''
          completed = '''<html><body><a>Completed</a><h1>Finished Novel</h1><div>Updated 2 years ago</div></body></html>'''
          assert extract_metadata('https://freewebnovel.com/novel/example', ongoing)['effective_status'] == 'ongoing'
          assert extract_metadata('https://freewebnovel.com/novel/old', stale)['effective_status'] == 'completed'
          assert extract_metadata('https://freewebnovel.com/novel/finished', completed)['effective_status'] == 'completed'
          print('classifier fixture tests passed')
          PY

      - name: Validate fresh complete source catalog
        working-directory: private-engine
        run: |
          set -euo pipefail
          test -s data/novel_link_discovery_report.json
          test -s data/novel_links.json
          jq -e '.complete == true and .errors == 0 and .catalog_source == "fresh_recursive_crawl"' data/novel_link_discovery_report.json >/dev/null
          jq -e 'type == "array" and length == ($ENV.STATUS_EXPECTED_CATALOG_COUNT | tonumber) and length == (unique | length)' data/novel_links.json >/dev/null
          jq -e 'all(.[]; type == "string" and startswith("https://freewebnovel.com/novel/"))' data/novel_links.json >/dev/null

      - name: Prepare resumable checkpoint publishing
        working-directory: private-engine
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/status_catalog_checkpoint.jsonl data/status_catalog_checkpoint_meta.json || true
          git reset -- data/status_catalog_checkpoint.jsonl data/status_catalog_checkpoint_meta.json || true

      - name: Reset completed checkpoint before a fresh catalog pass
        working-directory: private-engine
        run: |
          set -euo pipefail
          if test -s data/status_catalog_checkpoint_meta.json; then
            if jq -e '.complete == true' data/status_catalog_checkpoint_meta.json >/dev/null; then
              rm -f data/status_catalog_checkpoint.jsonl data/status_catalog_checkpoint_meta.json
              echo "Removed completed checkpoint; scheduled runs must reclassify the live catalog"
            fi
          fi

      - name: Classify every catalog novel until complete
        working-directory: private-engine
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          CHECKPOINT_PUBLISH: "1"
          GIT_CHECKPOINT_FORCE_ADD: "1"
          STATUS_RETRY_ROUND_DELAY: ${{ env.STATUS_RETRY_ROUND_DELAY }}
          STATUS_MAX_ROUNDS: ${{ env.STATUS_MAX_ROUNDS }}
        run: |
          set -euo pipefail
          python novel_status_classifier.py \
            --catalog data/novel_links.json \
            --completed-out data/completed_novels.json \
            --ongoing-out data/ongoing_novels.json \
            --report data/novel_status_catalog_report.json \
            --workers "$STATUS_WORKERS" \
            --timeout "$STATUS_REQUEST_TIMEOUT" \
            --retries "$STATUS_RETRIES" \
            --expected-count "$STATUS_EXPECTED_CATALOG_COUNT" \
            --retry-round-delay "$STATUS_RETRY_ROUND_DELAY" \
            --max-rounds "$STATUS_MAX_ROUNDS" \
            --checkpoint-path data/status_catalog_checkpoint.jsonl \
            --checkpoint-meta data/status_catalog_checkpoint_meta.json \
            --checkpoint-every "$STATUS_CHECKPOINT_EVERY"

      - name: Validate final status catalogs
        working-directory: private-engine
        run: |
          set -euo pipefail
          jq empty data/completed_novels.json
          jq empty data/ongoing_novels.json
          jq empty data/novel_status_catalog_report.json
          jq -e '.count == (.novels | length)' data/completed_novels.json >/dev/null
          jq -e '.count == (.novels | length)' data/ongoing_novels.json >/dev/null
          completed=$(jq -r '.count' data/completed_novels.json)
          ongoing=$(jq -r '.count' data/ongoing_novels.json)
          total=$((completed + ongoing))
          expected=$(jq -r '.expected_catalog_count' data/novel_status_catalog_report.json)
          test "$total" -eq "$expected"
          jq -e '.complete == true and .error_count == 0 and .processed_count == .catalog_count and .classified_count == .catalog_count' data/novel_status_catalog_report.json >/dev/null
          echo "FINAL_COMPLETED_COUNT=$completed"
          echo "FINAL_ONGOING_COUNT=$ongoing"
          echo "FINAL_TOTAL_COUNT=$total"
          jq '{catalog_count, processed_count, classified_count, completed_count, ongoing_count, error_count, retry_rounds, complete, classification_rules}' data/novel_status_catalog_report.json

      - name: Persist status catalogs to private engine
        working-directory: private-engine
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          export GIT_TERMINAL_PROMPT=0
          export GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_REPO_TOKEN" | base64 | tr -d '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/completed_novels.json data/ongoing_novels.json data/novel_status_catalog_report.json
          if git diff --cached --quiet; then
            echo "No status catalog changes"
            exit 0
          fi
          completed=$(jq -r '.count' data/completed_novels.json)
          ongoing=$(jq -r '.count' data/ongoing_novels.json)
          git commit -m "Update novel status catalogs: ${completed} completed, ${ongoing} ongoing"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$GIT_AUTH_HEADER" push origin HEAD:main; then
              exit 0
            fi
            echo "Private status catalog push conflicted; refreshing main and retrying ($attempt/3)"
            git -c http.extraheader="$GIT_AUTH_HEADER" fetch origin main
            git rebase origin/main
          done
          echo "Unable to publish status catalogs after 3 attempts"
          exit 1

      - name: Upload status-catalog artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webnovel-status-catalog
          path: |
            private-engine/data/completed_novels.json
            private-engine/data/ongoing_novels.json
            private-engine/data/novel_status_catalog_report.json
            private-engine/data/status_catalog_checkpoint.jsonl
            private-engine/data/status_catalog_checkpoint_meta.json
          if-no-files-found: ignore
          retention-days: 30

# run-now marker: bounded-retry-checkpoint-resume