name: WebNovel Production Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 0"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: webnovel-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: public-repo
          fetch-depth: 1
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-engine
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: private-engine/requirements.txt
      - name: Install pinned dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt
      - name: Compile and run tests
        working-directory: private-engine
        run: |
          set -euo pipefail
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          python self_check.py
          python discovery_crawler.py --self-test
      - name: Import every production Python entrypoint
        working-directory: private-engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          modules = [
              "novel_automator",
              "community_library_worker",
              "community_library_entrypoint",
              "monthly_ongoing_recheck",
              "monthly_community_entrypoint",
              "drive_storage",
              "drive_source_metadata",
              "sheet_aggregator",
              "discovery_crawler",
              "discovery_state_storage",
              "health_check",
              "self_check",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"IMPORT_OK {name}")
          PY
      - name: Verify every GitHub Action is SHA pinned
        working-directory: public-repo
        run: |
          set -euo pipefail
          bad=$(grep -R -nE '^[[:space:]]*uses:' .github/workflows | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [[ -n "$bad" ]]; then
            echo "Unpinned GitHub Actions detected:"
            echo "$bad"
            exit 1
          fi
      - name: Verify production workflow set
        working-directory: public-repo
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/webnovel.yml \
            .github/workflows/webnovel-discovery-primary.yml \
            .github/workflows/monthly-ongoing-recheck.yml \
            .github/workflows/webnovel-tracker-reconcile.yml \
            .github/workflows/webnovel-tracker-recovery.yml \
            .github/workflows/production-audit.yml \
            .github/workflows/deploy-pages.yml; do
            test -s "$file"
          done
      - name: Verify required private runtime files
        working-directory: public-repo
        run: |
          set -euo pipefail
          for file in \
            ../private-engine/novel_automator.py \
            ../private-engine/community_library_worker.py \
            ../private-engine/community_library_entrypoint.py \
            ../private-engine/monthly_ongoing_recheck.py \
            ../private-engine/monthly_community_entrypoint.py \
            ../private-engine/drive_storage.py \
            ../private-engine/drive_source_metadata.py \
            ../private-engine/sheet_aggregator.py \
            ../private-engine/discovery_crawler.py \
            ../private-engine/discovery_state_storage.py \
            ../private-engine/health_check.py \
            ../private-engine/self_check.py \
            ../private-engine/tests/test_core.py; do
            test -s "$file"
          done
      - name: Verify primary recursive discovery is fail-closed
        working-directory: public-repo
        run: |
          set -euo pipefail
          grep -q 'DISCOVERY_MODE: "primary"' .github/workflows/webnovel-discovery-primary.yml
          grep -q 'DISCOVERY_REQUIRE_REMOTE_STATE: "true"' .github/workflows/webnovel-discovery-primary.yml
          grep -q 'DISCOVERY_STATE_FOLDER_REQUIRED: "true"' .github/workflows/webnovel-discovery-primary.yml
          grep -q 'GOOGLE_DRIVE_CLIENT_ID:' .github/workflows/webnovel-discovery-primary.yml
          grep -q 'DISCOVERY_ROOTS' .github/workflows/webnovel-discovery-primary.yml
          grep -q 'discovery_crawler.py' .github/workflows/webnovel-discovery-primary.yml
          grep -q 'same_site_recursive' ../private-engine/discovery_crawler.py
          ! grep -q 'list(errors.items())\[:1000\]' ../private-engine/discovery_crawler.py
      - name: Verify immutable run provenance
        working-directory: public-repo
        run: |
          set -euo pipefail
          grep -q 'Write immutable run manifest' .github/workflows/webnovel.yml
          grep -q 'webnovel-run-manifest' .github/workflows/webnovel.yml
          grep -q 'engine_sha:' .github/workflows/webnovel.yml
          grep -q 'ref: ${{ needs.coordinator.outputs.engine_sha }}' .github/workflows/webnovel.yml
          grep -q 'result_sha256' .github/workflows/webnovel.yml
      - name: Verify process failures cannot advance scheduler state
        working-directory: public-repo
        run: |
          set -euo pipefail
          grep -q 'process_failed' .github/workflows/webnovel.yml
          grep -q 'Do not reconcile or advance the production scheduler' .github/workflows/webnovel.yml
          grep -q 'Advance scheduler state only after every worker succeeded' .github/workflows/webnovel.yml
      - name: Verify historical reconciliation uses exact engine revision
        working-directory: public-repo
        run: |
          set -euo pipefail
          grep -q 'webnovel-run-manifest' .github/workflows/webnovel-tracker-reconcile.yml
          grep -q 'engine_sha' .github/workflows/webnovel-tracker-reconcile.yml
          grep -q 'ref: ${{ steps.manifest.outputs.engine_sha }}' .github/workflows/webnovel-tracker-reconcile.yml
          grep -q 'sha256sum -c run-manifest.sha256' .github/workflows/webnovel-tracker-reconcile.yml
      - name: Verify tracker writes are fail-closed
        working-directory: private-engine
        run: |
          set -euo pipefail
          grep -q 'verify_written_tabs' sheet_aggregator.py
          grep -q 'Conflicting duplicate worker rows' sheet_aggregator.py
          grep -q 'Duplicate URL exists across tracker tabs' sheet_aggregator.py
          grep -q 'AuthorizedHttp' sheet_aggregator.py
          grep -q 'return download_status in SUCCESS_DOWNLOAD_STATUSES and bool(drive_file_id)' sheet_aggregator.py
      - name: Verify manual tests never advance production scheduler
        working-directory: public-repo
        run: |
          set -euo pipefail
          grep -q "github.event_name == 'schedule'" .github/workflows/webnovel.yml
          grep -q "github.event_name == 'schedule'" .github/workflows/monthly-ongoing-recheck.yml
      - name: Verify scheduler state push has conflict recovery
        working-directory: public-repo
        run: |
          set -euo pipefail
          grep -q 'git rebase origin/main' .github/workflows/webnovel.yml
          grep -q 'for attempt in 1 2 3' .github/workflows/webnovel.yml
      - name: Verify no obsolete retry wrapper remains
        working-directory: private-engine
        run: test ! -e run_worker_retry.py
