name: WebNovel Production Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 0"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: webnovel-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: public-repo
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-engine
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: private-engine/requirements.txt
      - name: Install pinned dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependency consistency
        working-directory: private-engine
        run: python -m pip check
      - name: Compile and run tests
        working-directory: private-engine
        run: |
          set -euo pipefail
          mapfile -t sources < <(find . -type f -name '*.py' -not -path './.git/*' | sort)
          test "${#sources[@]}" -gt 0
          python -m py_compile "${sources[@]}"
          python -m unittest discover -s tests -v
          python self_check.py
          python discovery_crawler.py --self-test
          python production_audit.py
      - name: Verify every GitHub Action is SHA pinned
        working-directory: public-repo
        run: |
          set -euo pipefail
          bad=$(grep -R -nE '^[[:space:]]*uses:' .github/workflows | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [[ -n "$bad" ]]; then
            echo "Unpinned GitHub Actions detected:"
            echo "$bad"
            exit 1
          fi
      - name: Verify required production workflow set
        working-directory: public-repo
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            test -s "$file"
          done
      - name: Verify no direct production bypasses
        working-directory: public-repo
        run: |
          set -euo pipefail
          test -s .github/workflows/webnovel-production-e2e.yml
          grep -q 'Fail-closed E2E validation' .github/workflows/webnovel-production-e2e.yml
          grep -q 'persist-credentials: false' .github/workflows/webnovel-production-e2e.yml
      - name: Verify scheduler state remains protected
        working-directory: public-repo
        run: |
          set -euo pipefail
          test -s state/scheduler_state.json
          jq -e '.run_index | numbers' state/scheduler_state.json >/dev/null
          grep -q 'Advance scheduler state only after every worker succeeded' .github/workflows/webnovel.yml
          grep -q 'process_failed_count=' .github/workflows/webnovel.yml
          grep -q 'git rebase origin/main' .github/workflows/webnovel.yml
      - name: Verify private engine provenance in public workflow
        working-directory: public-repo
        run: |
          set -euo pipefail
          grep -q 'Write immutable run manifest' .github/workflows/webnovel.yml
          grep -q 'ref: ${{ needs.coordinator.outputs.engine_sha }}' .github/workflows/webnovel.yml
          grep -q 'result_sha256' .github/workflows/webnovel.yml
      - name: Verify private runtime files are present
        working-directory: private-engine
        run: |
          set -euo pipefail
          for file in parallel_community_runner.py community_library_entrypoint.py community_library_worker.py community_match.py drive_storage.py drive_source_metadata.py epub_validator.py e2e_gate.py production_audit.py runtime_log.py; do
            test -s "$file"
          done
      - name: Verify structured runtime log facility
        working-directory: private-engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import runtime_log
          runtime_log.run_context(workflow="production-audit", phase="audit")
          print(runtime_log.LOG_FILE)
          PY
