name: WebNovel Tracker Reconcile

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "WebNovel Downloader run ID whose worker artifacts should be reconciled"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.12"
  GOOGLE_COMPLETED_SHEET: "Sheet1"
  GOOGLE_ONGOING_SHEET: "Sheet2"
  SHEETS_HTTP_TIMEOUT_SECONDS: "120"
  SHEETS_RETRY_ATTEMPTS: "7"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate run ID
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be numeric"; exit 1; }
          echo "Reconciling WebNovel Downloader run $RUN_ID"

      - name: Download run manifest and worker artifacts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const fs = require('fs');
            const runId = Number(process.env.RUN_ID);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.data.name !== 'WebNovel Downloader') {
              core.setFailed(`Run ${runId} belongs to workflow '${run.data.name}', not 'WebNovel Downloader'`);
              return;
            }
            if (run.data.status !== 'completed') {
              core.setFailed(`Run ${runId} is not completed (status=${run.data.status})`);
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 }
            );
            const wanted = artifacts.filter(a => /^webnovel-worker-(?:[0-9]+)$/.test(a.name) && !a.expired);
            const expected = new Set(Array.from({length: 20}, (_, i) => `webnovel-worker-${i}`));
            if (wanted.length !== expected.size) {
              core.setFailed(`Expected 20 non-expired worker artifacts; found ${wanted.length} for run ${runId}`);
              return;
            }
            for (const name of expected) {
              if (!wanted.some(a => a.name === name)) {
                core.setFailed(`Missing artifact ${name} for run ${runId}`);
                return;
              }
            }
            const manifest = artifacts.filter(a => a.name === 'webnovel-run-manifest' && !a.expired);
            if (manifest.length !== 1) {
              core.setFailed(`Expected exactly one non-expired webnovel-run-manifest; found ${manifest.length}`);
              return;
            }
            fs.mkdirSync('results', { recursive: true });
            for (const artifact of wanted) {
              const response = await github.rest.actions.downloadArtifact({
                owner, repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              fs.writeFileSync(`results/${artifact.name}.zip`, Buffer.from(response.data));
              core.info(`Downloaded ${artifact.name}`);
            }
            const manifestResponse = await github.rest.actions.downloadArtifact({
              owner, repo, artifact_id: manifest[0].id, archive_format: 'zip'
            });
            fs.mkdirSync('run-manifest', { recursive: true });
            fs.writeFileSync('run-manifest/run-manifest.zip', Buffer.from(manifestResponse.data));

      - name: Extract and validate run manifest
        id: manifest
        env:
          EXPECTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          unzip -q run-manifest/run-manifest.zip -d run-manifest/extracted
          test -s run-manifest/extracted/run-manifest.json
          test -s run-manifest/extracted/run-manifest.sha256
          (cd run-manifest/extracted && sha256sum -c run-manifest.sha256)
          jq empty run-manifest/extracted/run-manifest.json
          workflow=$(jq -r '.workflow' run-manifest/extracted/run-manifest.json)
          run_id=$(jq -r '.workflow_run_id' run-manifest/extracted/run-manifest.json)
          workers=$(jq -e '.worker_count | numbers' run-manifest/extracted/run-manifest.json)
          engine_sha=$(jq -r '.engine_sha' run-manifest/extracted/run-manifest.json)
          [[ "$workflow" == "WebNovel Downloader" ]] || { echo "Invalid manifest workflow: $workflow"; exit 1; }
          [[ "$run_id" == "$EXPECTED_RUN_ID" ]] || { echo "Manifest run ID $run_id does not match requested $EXPECTED_RUN_ID"; exit 1; }
          [[ "$workers" -eq 20 ]] || { echo "Manifest worker count $workers is not 20"; exit 1; }
          [[ "$engine_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Manifest engine SHA is not a full commit SHA"; exit 1; }
          echo "engine_sha=$engine_sha" >> "$GITHUB_OUTPUT"
          echo "Validated immutable run manifest for run $run_id using private engine $engine_sha"

      - name: Extract worker artifacts
        run: |
          set -euo pipefail
          mkdir -p extracted
          for zip in results/*.zip; do
            name=$(basename "$zip" .zip)
            mkdir -p "extracted/$name"
            unzip -q "$zip" -d "extracted/$name"
          done
          count=$(find extracted -type f -name worker_result.json | wc -l)
          test "$count" -eq 20
          echo "Extracted $count worker results."

      - name: Validate worker provenance and result integrity
        env:
          EXPECTED_ENGINE_SHA: ${{ steps.manifest.outputs.engine_sha }}
        run: |
          set -euo pipefail
          mapfile -t markers < <(find extracted -type f -name worker_execution_marker.json | sort)
          test "${#markers[@]}" -eq 20
          declare -A seen=()
          for marker in "${markers[@]}"; do
            jq empty "$marker"
            rid=$(jq -e '.worker_id | numbers' "$marker")
            engine=$(jq -e '.engine_sha | strings' "$marker")
            status=$(jq -e '.status | strings' "$marker")
            run=$(jq -e '.run_index | numbers' "$marker")
            result_sha=$(jq -r '.result_sha256 // ""' "$marker")
            test "$engine" = "$EXPECTED_ENGINE_SHA"
            [[ "$status" == "completed" ]] || { echo "Worker $rid has process status $status; reconciliation refused"; exit 1; }
            [[ -z "${seen[$rid]+x}" ]] || { echo "Duplicate worker marker: $rid"; exit 1; }
            seen[$rid]=1
            result_file=$(dirname "$marker")/worker_result.json
            test -s "$result_file"
            test "$result_sha" = "$(sha256sum "$result_file" | awk '{print $1}')"
            jq empty "$result_file"
            jq -e '.rows | arrays' "$result_file" >/dev/null
            jq -e '.run_index | numbers' "$result_file" >/dev/null
            test "$(jq -r '.run_index' "$result_file")" -eq "$run"
          done
          for expected in $(seq 0 19); do
            [[ -n "${seen[$expected]+x}" ]] || { echo "Missing worker marker: $expected"; exit 1; }
          done

      - name: Checkout exact private engine revision used by the run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.manifest.outputs.engine_sha }}
          path: private-engine
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: private-engine/requirements.txt

      - name: Install dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt

      - name: Reconcile Sheet1 and Sheet2 from existing worker results
        working-directory: private-engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_COMPLETED_SHEET: ${{ env.GOOGLE_COMPLETED_SHEET }}
          GOOGLE_ONGOING_SHEET: ${{ env.GOOGLE_ONGOING_SHEET }}
          SHEETS_HTTP_TIMEOUT_SECONDS: ${{ env.SHEETS_HTTP_TIMEOUT_SECONDS }}
          SHEETS_RETRY_ATTEMPTS: ${{ env.SHEETS_RETRY_ATTEMPTS }}
          RUN_ID: ${{ inputs.run_id }}
          ENGINE_SHA: ${{ steps.manifest.outputs.engine_sha }}
        run: |
          set -euo pipefail
          python sheet_aggregator.py ../extracted
          echo "Tracker reconciliation completed for downloader run $RUN_ID"
          test -s tracker_summary.json
          cat tracker_summary.json

      - name: Upload reconciliation summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webnovel-tracker-reconciliation-${{ inputs.run_id }}
          path: private-engine/tracker_summary.json
          if-no-files-found: ignore
          retention-days: 30
