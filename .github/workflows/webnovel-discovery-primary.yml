name: WebNovel Novel-Link Discovery

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DISCOVERY_MODE: "primary"
  DISCOVERY_REQUIRE_REMOTE_STATE: "false"
  DISCOVERY_STATE_BACKEND: "local"
  DISCOVERY_WORKERS: "8"
  DISCOVERY_REQUEST_TIMEOUT: "30"
  DISCOVERY_DELAY_SECONDS: "0.15"
  DISCOVERY_CHECKPOINT_PAGES: "250"
  DISCOVERY_PAGE_RETRIES: "3"
  DISCOVERY_LOCAL_STATE_FILE: "data/novel_link_discovery_state.json"
  DISCOVERY_OUTPUT_FILE: "data/novel_links.json"
  DISCOVERY_REPORT_FILE: "data/novel_link_discovery_report.json"
  DISCOVERY_ROOTS: "https://freewebnovel.com/"

concurrency:
  group: webnovel-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-engine
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: private-engine/requirements.txt

      - name: Install dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt

      - name: Compile and self-test
        working-directory: private-engine
        run: |
          set -euo pipefail
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          python discovery_crawler.py --self-test

      - name: Discover every reachable same-site novel link
        id: crawl
        working-directory: private-engine
        env:
          DISCOVERY_MODE: ${{ env.DISCOVERY_MODE }}
          DISCOVERY_REQUIRE_REMOTE_STATE: ${{ env.DISCOVERY_REQUIRE_REMOTE_STATE }}
          DISCOVERY_STATE_BACKEND: ${{ env.DISCOVERY_STATE_BACKEND }}
          DISCOVERY_LOCAL_STATE_FILE: ${{ env.DISCOVERY_LOCAL_STATE_FILE }}
          DISCOVERY_OUTPUT_FILE: ${{ env.DISCOVERY_OUTPUT_FILE }}
          DISCOVERY_REPORT_FILE: ${{ env.DISCOVERY_REPORT_FILE }}
          DISCOVERY_ROOTS: ${{ env.DISCOVERY_ROOTS }}
          DISCOVERY_WORKERS: ${{ env.DISCOVERY_WORKERS }}
          DISCOVERY_REQUEST_TIMEOUT: ${{ env.DISCOVERY_REQUEST_TIMEOUT }}
          DISCOVERY_DELAY_SECONDS: ${{ env.DISCOVERY_DELAY_SECONDS }}
          DISCOVERY_CHECKPOINT_PAGES: ${{ env.DISCOVERY_CHECKPOINT_PAGES }}
          DISCOVERY_PAGE_RETRIES: ${{ env.DISCOVERY_PAGE_RETRIES }}
        run: |
          set +e
          python discovery_crawler.py > discovery_result.json 2>&1
          rc=$?
          set -e
          cat discovery_result.json
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize verified terminal 404s
        working-directory: private-engine
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("data/novel_link_discovery_report.json")
          state_path = Path("data/novel_link_discovery_state.json")

          terminal_404s = {
              "https://freewebnovel.com/cdn-cgi/l/email-protection",
              "https://freewebnovel.com/genre/Video+Games",
          }

          report = json.loads(report_path.read_text(encoding="utf-8"))
          samples = dict(report.get("error_samples") or {})
          terminal = {}
          blocking = {}
          for url, error in samples.items():
              if url in terminal_404s and error == "HTTP 404":
                  terminal[url] = error
              else:
                  blocking[url] = error

          if terminal:
              existing_terminal = dict(report.get("non_blocking_error_samples") or {})
              existing_terminal.update(terminal)
              report["non_blocking_error_samples"] = existing_terminal
              report["non_blocking_errors"] = len(existing_terminal)

          report["error_samples"] = blocking
          report["errors"] = len(blocking)
          if not report.get("interrupted") and not report.get("queue_remaining"):
              report["complete"] = len(blocking) == 0
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          state = json.loads(state_path.read_text(encoding="utf-8"))
          state_errors = dict(state.get("errors") or {})
          for url in terminal_404s:
              state_errors.pop(url, None)
          state["errors"] = state_errors
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          jq empty data/novel_link_discovery_report.json
          jq empty data/novel_link_discovery_state.json

      - name: Persist discovery checkpoint to private engine
        working-directory: private-engine
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          export GIT_TERMINAL_PROMPT=0
          export GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_REPO_TOKEN" | base64 | tr -d '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/novel_links.json data/novel_link_discovery_report.json data/novel_link_discovery_state.json || true
          if git diff --cached --quiet; then
            echo "No discovery checkpoint change"
            exit 0
          fi
          count=0
          if test -s data/novel_links.json; then
            count=$(jq 'length' data/novel_links.json)
          fi
          complete=false
          if test -s data/novel_link_discovery_report.json; then
            complete=$(jq -r '.complete // false' data/novel_link_discovery_report.json)
          fi
          git commit -m "Update novel-link discovery checkpoint: ${count} links (complete=${complete})"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$GIT_AUTH_HEADER" push origin HEAD:main; then
              exit 0
            fi
            echo "Private discovery checkpoint push conflicted; refreshing main and retrying ($attempt/3)"
            git -c http.extraheader="$GIT_AUTH_HEADER" fetch origin main
            git rebase origin/main
          done
          echo "Unable to publish discovery checkpoint after 3 attempts"
          exit 1

      - name: Validate final catalog only when the crawl is complete
        working-directory: private-engine
        run: |
          set -euo pipefail
          test -s data/novel_link_discovery_report.json
          jq empty data/novel_link_discovery_report.json
          if ! jq -e '.complete == true and .errors == 0 and .catalog_source == "fresh_recursive_crawl"' data/novel_link_discovery_report.json >/dev/null; then
            echo "Discovery is still in progress; the persisted checkpoint will be resumed by the next scheduled run."
            jq '{complete, errors, non_blocking_errors, visited_pages, novel_link_observations, unique_novel_urls, queue_remaining: (if .queue then (.queue|length) else null end)}' data/novel_link_discovery_report.json || true
            exit 0
          fi
          test -s data/novel_links.json
          jq empty data/novel_links.json
          jq -e 'type == "array" and length > 0' data/novel_links.json >/dev/null
          jq -e 'all(.[]; type == "string" and startswith("https://freewebnovel.com/novel/"))' data/novel_links.json >/dev/null
          jq -e 'length == (unique | length)' data/novel_links.json >/dev/null
          jq -e '.complete == true and .errors == 0 and .catalog_source == "fresh_recursive_crawl"' data/novel_link_discovery_report.json >/dev/null
          echo "FINAL_NOVEL_LINK_COUNT=$(jq 'length' data/novel_links.json)"
          jq . data/novel_link_discovery_report.json

      - name: Upload novel-link discovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webnovel-novel-link-discovery-report
          path: |
            private-engine/data/novel_link_discovery_report.json
            private-engine/data/novel_links.json
            private-engine/data/novel_link_discovery_state.json
          if-no-files-found: ignore
          retention-days: 30
