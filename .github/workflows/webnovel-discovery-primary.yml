name: WebNovel Novel-Link Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/webnovel-discovery-primary.yml"
  schedule:
    - cron: "5 0,6,12,18 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DISCOVERY_MODE: "primary"
  DISCOVERY_REQUIRE_REMOTE_STATE: "true"
  DISCOVERY_STATE_FOLDER_REQUIRED: "true"
  DISCOVERY_WORKERS: "8"
  DISCOVERY_REQUEST_TIMEOUT: "30"
  DISCOVERY_DELAY_SECONDS: "0.15"
  DISCOVERY_CHECKPOINT_PAGES: "250"
  DISCOVERY_PAGE_RETRIES: "3"
  DISCOVERY_STATE_NAME: "freewebnovel-novel-link-discovery-state.json"
  DISCOVERY_OUTPUT_FILE: "data/novel_links.json"
  DISCOVERY_REPORT_FILE: "data/novel_link_discovery_report.json"
  DISCOVERY_ROOTS: "https://freewebnovel.com/"

concurrency:
  group: webnovel-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-engine
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: private-engine/requirements.txt

      - name: Install dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt

      - name: Compile and self-test
        working-directory: private-engine
        run: |
          set -euo pipefail
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          python discovery_crawler.py --self-test

      - name: Discover every reachable same-site novel link
        working-directory: private-engine
        env:
          DISCOVERY_MODE: ${{ env.DISCOVERY_MODE }}
          DISCOVERY_REQUIRE_REMOTE_STATE: ${{ env.DISCOVERY_REQUIRE_REMOTE_STATE }}
          DISCOVERY_STATE_FOLDER_REQUIRED: ${{ env.DISCOVERY_STATE_FOLDER_REQUIRED }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DISCOVERY_STATE_FOLDER_ID: ${{ secrets.DISCOVERY_STATE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCOVERY_STATE_NAME: ${{ env.DISCOVERY_STATE_NAME }}
          DISCOVERY_OUTPUT_FILE: ${{ env.DISCOVERY_OUTPUT_FILE }}
          DISCOVERY_REPORT_FILE: ${{ env.DISCOVERY_REPORT_FILE }}
          DISCOVERY_ROOTS: ${{ env.DISCOVERY_ROOTS }}
          DISCOVERY_WORKERS: ${{ env.DISCOVERY_WORKERS }}
          DISCOVERY_REQUEST_TIMEOUT: ${{ env.DISCOVERY_REQUEST_TIMEOUT }}
          DISCOVERY_DELAY_SECONDS: ${{ env.DISCOVERY_DELAY_SECONDS }}
          DISCOVERY_CHECKPOINT_PAGES: ${{ env.DISCOVERY_CHECKPOINT_PAGES }}
          DISCOVERY_PAGE_RETRIES: ${{ env.DISCOVERY_PAGE_RETRIES }}
        run: |
          set -euo pipefail
          test -n "${DISCOVERY_STATE_FOLDER_ID:-}${GOOGLE_DRIVE_FOLDER_ID:-}"
          echo "Remote discovery checkpoint state is mandatory in production."
          python discovery_crawler.py

      - name: Require a complete, error-free novel-link crawl
        working-directory: private-engine
        run: |
          set -euo pipefail
          test -s data/novel_links.json
          jq empty data/novel_links.json
          jq -e 'type == "array" and length > 0' data/novel_links.json >/dev/null
          jq -e 'all(.[]; type == "string" and startswith("https://freewebnovel.com/novel/"))' data/novel_links.json >/dev/null
          jq -e 'length == (unique | length)' data/novel_links.json >/dev/null
          jq -e '.complete == true and .errors == 0 and .catalog_source == "fresh_recursive_crawl"' data/novel_link_discovery_report.json >/dev/null
          jq . data/novel_link_discovery_report.json

      - name: Publish novel-link JSON to private engine
        working-directory: private-engine
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          export GIT_TERMINAL_PROMPT=0
          export GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_REPO_TOKEN" | base64 | tr -d '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/novel_links.json
          if git diff --cached --quiet; then
            echo "No novel-link catalog change"
            exit 0
          fi
          count=$(jq 'length' data/novel_links.json)
          git commit -m "Update FreeWebNovel link catalog: ${count} novel links"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$GIT_AUTH_HEADER" push origin HEAD:main; then
              exit 0
            fi
            echo "Private novel-link catalog push conflicted; refreshing main and retrying ($attempt/3)"
            git -c http.extraheader="$GIT_AUTH_HEADER" fetch origin main
            git rebase origin/main
          done
          echo "Unable to publish novel-link catalog after 3 attempts"
          exit 1

      - name: Upload novel-link discovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webnovel-novel-link-discovery-report
          path: |
            private-engine/data/novel_link_discovery_report.json
            private-engine/data/novel_links.json
          if-no-files-found: ignore
          retention-days: 30
