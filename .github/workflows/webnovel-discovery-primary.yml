name: WebNovel Recursive Discovery Primary

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: webnovel-discovery
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DISCOVERY_MODE: "primary"
  DISCOVERY_REQUIRE_REMOTE_STATE: "true"
  DISCOVERY_WORKERS: "8"
  DISCOVERY_REQUEST_TIMEOUT: "30"
  DISCOVERY_DELAY_SECONDS: "0.15"
  DISCOVERY_CHECKPOINT_PAGES: "250"
  DISCOVERY_PAGE_RETRIES: "3"
  DISCOVERY_STATE_NAME: "freewebnovel-recursive-state.json"
  NOVEL_SOURCE_FILE: "data/scraped_novels.json"
  DISCOVERY_OUTPUT_FILE: "data/discovered_novels.json"
  DISCOVERY_REPORT_FILE: "data/discovery_report.json"
  DISCOVERY_ROOTS: "https://freewebnovel.com/home,https://freewebnovel.com/sort/latest-novel/,https://freewebnovel.com/sort/latest-release/"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout private engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: therandomhuman-hub/FreewebnovelDownloader_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-engine
          persist-credentials: true
      - name: Verify required discovery secret configuration
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN GOOGLE_DRIVE_FOLDER_ID; do
            value="${!name:-}"
            test -n "$value" || { echo "Missing required secret: $name"; exit 1; }
          done
          echo "Required discovery secrets are present."
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: private-engine/requirements.txt
      - name: Install dependencies
        working-directory: private-engine
        run: python -m pip install -r requirements.txt
      - name: Compile and self-test
        working-directory: private-engine
        run: |
          set -euo pipefail
          python -m py_compile *.py tests/*.py
          python -m unittest discover -s tests -v
          python discovery_crawler.py --self-test
      - name: Recursively discover every reachable same-site page
        working-directory: private-engine
        env:
          DISCOVERY_MODE: ${{ env.DISCOVERY_MODE }}
          DISCOVERY_REQUIRE_REMOTE_STATE: ${{ env.DISCOVERY_REQUIRE_REMOTE_STATE }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DISCOVERY_STATE_NAME: ${{ env.DISCOVERY_STATE_NAME }}
          NOVEL_SOURCE_FILE: ${{ env.NOVEL_SOURCE_FILE }}
          DISCOVERY_OUTPUT_FILE: ${{ env.DISCOVERY_OUTPUT_FILE }}
          DISCOVERY_REPORT_FILE: ${{ env.DISCOVERY_REPORT_FILE }}
          DISCOVERY_ROOTS: ${{ env.DISCOVERY_ROOTS }}
          DISCOVERY_WORKERS: ${{ env.DISCOVERY_WORKERS }}
          DISCOVERY_REQUEST_TIMEOUT: ${{ env.DISCOVERY_REQUEST_TIMEOUT }}
          DISCOVERY_DELAY_SECONDS: ${{ env.DISCOVERY_DELAY_SECONDS }}
          DISCOVERY_CHECKPOINT_PAGES: ${{ env.DISCOVERY_CHECKPOINT_PAGES }}
          DISCOVERY_PAGE_RETRIES: ${{ env.DISCOVERY_PAGE_RETRIES }}
        run: python discovery_crawler.py
      - name: Require a complete, error-free crawl before replacing the catalog
        working-directory: private-engine
        run: |
          set -euo pipefail
          test -s data/discovered_novels.json
          jq empty data/discovered_novels.json
          jq -e 'type == "array" and length > 0' data/discovered_novels.json >/dev/null
          jq -e 'all(.[]; type == "string" and startswith("https://freewebnovel.com/novel/"))' data/discovered_novels.json >/dev/null
          jq -e 'length == (unique | length)' data/discovered_novels.json >/dev/null
          jq -e '.complete == true and .errors == 0 and .persistent_state == true' data/discovery_report.json >/dev/null
          jq . data/discovery_report.json
      - name: Replace the master catalog
        working-directory: private-engine
        run: cp data/discovered_novels.json data/scraped_novels.json
      - name: Commit expanded catalog
        working-directory: private-engine
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped_novels.json
          if git diff --cached --quiet; then
            echo "No catalog change"
            exit 0
          fi
          count=$(jq 'length' data/scraped_novels.json)
          new=$(jq -r '.new_novel_urls' data/discovery_report.json)
          git commit -m "Update recursive FreeWebNovel catalog: ${count} novels (${new} new)"
          git push origin HEAD:main
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webnovel-primary-discovery-report
          path: |
            private-engine/data/discovery_report.json
            private-engine/data/discovered_novels.json
          if-no-files-found: ignore
          retention-days: 7
